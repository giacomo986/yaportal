<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 788 278"
     width="788" height="278" role="img" aria-label="Per-player, per-portal state machine: Outside becomes Inside on entering the bounds, Inside fires the teleport once when the trigger depth is crossed from the front, and both Inside and Fired return to Outside on leaving the bounds.">
  <title>trigger-state-machine</title>
  <desc>One record per player per portal. The triggered flag is what makes the crossing fire exactly once; the arrival portal is seeded entered_from_front = false, which is what stops it bouncing the player straight back.</desc>
  <style>
    .bg   { fill: #FFFFFF; }
    .edge { fill: none; stroke: #DBE2E9; stroke-width: 1; }
    svg   { color: #10151C; }
    @media (prefers-color-scheme: dark) {
      .bg   { fill: #121921; }
      .edge { stroke: #1E2A36; }
      svg   { color: #E4EBF2; }
    }
    text { font-family: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Mono", Menlo, Consolas, monospace; font-size: 12px; fill: currentColor; }
    .lbl { font-size: 10.5px; opacity: .72; }
    .sub { font-size: 10.5px; opacity: .7; }
    .hd  { font-size: 10px; letter-spacing: .12em; opacity: .55; }
    .box { fill: none; stroke: currentColor; stroke-width: 1.4; }
    .grp { fill: none; stroke: currentColor; stroke-width: 1; stroke-dasharray: 4 4; opacity: .4; }
    .fl  { fill: none; stroke: currentColor; stroke-width: 1.4; }
    .life{ stroke: currentColor; stroke-width: 1; stroke-dasharray: 3 4; opacity: .4; }
    .k   { stroke: #3193DB; }
    .o   { stroke: #DD7F3C; }
    text.k { fill: #3193DB; stroke: none; }
    text.o { fill: #DD7F3C; stroke: none; }
  </style>
  <rect class="bg" x="0" y="0" width="788" height="278" rx="4"/>
  <rect class="edge" x="0.5" y="0.5" width="787" height="277" rx="4"/>
  <g transform="translate(14 14)">
<defs>
    <marker id="d2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/>
    </marker>
    <marker id="d2k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3193DB"/>
    </marker>
  </defs>

  <circle cx="16" cy="112" r="5" fill="currentColor"/>
  <line class="fl" x1="24" y1="112" x2="36" y2="112" marker-end="url(#d2)"/>

  <rect class="box" x="40" y="90" width="150" height="44" rx="3"/>
  <text x="115" y="117" text-anchor="middle">Outside</text>
  <rect class="box" x="300" y="90" width="150" height="44" rx="3"/>
  <text x="375" y="117" text-anchor="middle">Inside</text>
  <rect class="box k" x="560" y="90" width="150" height="44" rx="3"/>
  <text class="k" x="635" y="117" text-anchor="middle">Fired</text>

  <line class="fl" x1="190" y1="102" x2="296" y2="102" marker-end="url(#d2)"/>
  <text class="lbl" x="243" y="66" text-anchor="middle">in_portal_bounds()</text>
  <text class="lbl" x="243" y="80" text-anchor="middle">entered_from_front = on_ns_side()</text>

  <line class="fl" x1="296" y1="124" x2="194" y2="124" marker-end="url(#d2)"/>
  <text class="lbl" x="243" y="146" text-anchor="middle">left bounds → triggered = false</text>

  <line class="fl k" x1="450" y1="112" x2="556" y2="112" marker-end="url(#d2k)"/>
  <text class="lbl" x="503" y="66" text-anchor="middle">entered_from_front and</text>
  <text class="lbl" x="503" y="80" text-anchor="middle">(past_trigger or border_entry)</text>

  <path class="fl" d="M 635 134 L 635 196 L 115 196 L 115 138" marker-end="url(#d2)"/>
  <text class="lbl" x="375" y="214" text-anchor="middle">left bounds</text>
  </g>
</svg>
