<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 668 278"
     width="668" height="278" role="img" aria-label="Eye-space diagram: the standard near plane sits close to the virtual camera and lets geometry between the camera and the portal into the image; the oblique near plane is tilted onto the portal surface so that geometry is clipped away.">
  <title>oblique-near-plane</title>
  <desc>The near plane is replaced, not added. Row 2 of the projection matrix is rewritten so the near plane lies on the exit portal's surface; everything between the virtual camera and that plane is clipped by the hardware, at no per-object cost. Applied only when the camera is on the destination side.</desc>
  <style>
    .bg   { fill: #FFFFFF; }
    .edge { fill: none; stroke: #DBE2E9; stroke-width: 1; }
    svg   { color: #10151C; }
    @media (prefers-color-scheme: dark) {
      .bg   { fill: #121921; }
      .edge { stroke: #1E2A36; }
      svg   { color: #E4EBF2; }
    }
  </style>
  <rect class="bg" x="0" y="0" width="668" height="278" rx="4"/>
  <rect class="edge" x="0.5" y="0.5" width="667" height="277" rx="4"/>
  <g transform="translate(14 14)">
<defs>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/>
    </marker>
  </defs>
  <g font-family="ui-monospace, monospace" font-size="12" fill="currentColor">
    <!-- camera -->
    <circle cx="70" cy="125" r="5" fill="currentColor"/>
    <text x="30" y="152" font-size="11">vcam</text>
    <!-- frustum -->
    <line x1="70" y1="125" x2="600" y2="35" stroke="currentColor" stroke-width="1" opacity=".45"/>
    <line x1="70" y1="125" x2="600" y2="215" stroke="currentColor" stroke-width="1" opacity=".45"/>
    <!-- standard near plane -->
    <line x1="140" y1="103" x2="140" y2="147" stroke="currentColor" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="112" y="94" font-size="11" opacity=".7">standard near</text>
    <!-- unwanted geometry -->
    <rect x="200" y="96" width="42" height="42" fill="currentColor" opacity=".18"/>
    <rect x="256" y="126" width="34" height="34" fill="currentColor" opacity=".18"/>
    <text x="104" y="196" font-size="11" opacity=".7">geometry in front of the exit</text>
    <text x="104" y="211" font-size="11" opacity=".7">— must not reach the image</text>
    <!-- portal surface / oblique plane -->
    <line x1="330" y1="205" x2="430" y2="35" stroke="#3193DB" stroke-width="3"/>
    <line x1="298" y1="52" x2="418" y2="40" stroke="#3193DB" stroke-width="1" opacity=".6"/>
    <text x="150" y="42" fill="#3193DB">oblique near plane</text>
    <text x="150" y="58" font-size="11" opacity=".7">= exit portal surface, +0.49·BS</text>
    <!-- kept geometry -->
    <rect x="470" y="120" width="40" height="40" fill="#3193DB" opacity=".28"/>
    <rect x="520" y="150" width="30" height="30" fill="#3193DB" opacity=".28"/>
    <text x="474" y="110" font-size="11" fill="#3193DB">kept: the destination</text>
    <!-- forward axis -->
    <line x1="70" y1="235" x2="180" y2="235" stroke="currentColor" stroke-width="1.2" marker-end="url(#ar2)" opacity=".6"/>
    <text x="186" y="239" font-size="11" opacity=".6">+z_eye = vdir</text>
  </g>
  </g>
</svg>
