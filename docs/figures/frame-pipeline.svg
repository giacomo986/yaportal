<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 728 606"
     width="728" height="606" role="img" aria-label="Frame order: PortalPrepareStep poses the virtual cameras, builds the portal draw list and renders every RTT before Draw3D; the portal quads are drawn by a hook at the end of Draw3D's solid pass so the transparent pass can blend over them; PortalQuadStep afterwards re-renders only if the camera teleported mid-frame.">
  <title>frame-pipeline</title>
  <desc>Both placements are load-bearing. The RTT pass runs before Draw3D so it leaves the driver at FBO 0 and Draw3D can re-bind its own target cleanly. The quads are drawn inside the solid pass, because transparent geometry writes depth and would z-cull a quad drawn after it.</desc>
  <style>
    .bg   { fill: #FFFFFF; }
    .edge { fill: none; stroke: #DBE2E9; stroke-width: 1; }
    svg   { color: #10151C; }
    @media (prefers-color-scheme: dark) {
      .bg   { fill: #121921; }
      .edge { stroke: #1E2A36; }
      svg   { color: #E4EBF2; }
    }
    text { font-family: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Mono", Menlo, Consolas, monospace; font-size: 12px; fill: currentColor; }
    .lbl { font-size: 10.5px; opacity: .72; }
    .sub { font-size: 10.5px; opacity: .7; }
    .hd  { font-size: 10px; letter-spacing: .12em; opacity: .55; }
    .box { fill: none; stroke: currentColor; stroke-width: 1.4; }
    .grp { fill: none; stroke: currentColor; stroke-width: 1; stroke-dasharray: 4 4; opacity: .4; }
    .fl  { fill: none; stroke: currentColor; stroke-width: 1.4; }
    .life{ stroke: currentColor; stroke-width: 1; stroke-dasharray: 3 4; opacity: .4; }
    .k   { stroke: #3193DB; }
    .o   { stroke: #DD7F3C; }
    text.k { fill: #3193DB; stroke: none; }
    text.o { fill: #DD7F3C; stroke: none; }
  </style>
  <rect class="bg" x="0" y="0" width="728" height="606" rx="4"/>
  <rect class="edge" x="0.5" y="0.5" width="727" height="605" rx="4"/>
  <g transform="translate(14 14)">
<defs>
    <marker id="d3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/>
    </marker>
    <marker id="d3k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3193DB"/>
    </marker>
  </defs>

  <rect class="box k" x="150" y="16" width="360" height="34" rx="3"/>
  <text class="k" x="330" y="38" text-anchor="middle">PortalPrepareStep</text>
  <line class="fl" x1="330" y1="50" x2="330" y2="60" marker-end="url(#d3)"/>

  <rect class="box" x="150" y="62" width="360" height="34" rx="3"/>
  <text class="sub" x="330" y="84" text-anchor="middle">ensureCameras / ensureRenderTextures</text>
  <line class="fl" x1="330" y1="96" x2="330" y2="106" marker-end="url(#d3)"/>

  <rect class="box" x="150" y="108" width="360" height="46" rx="3"/>
  <text class="sub" x="330" y="127" text-anchor="middle">Phase 1 — pose every virtual camera</text>
  <text class="sub" x="330" y="143" text-anchor="middle">+ sample destination brightness</text>
  <line class="fl" x1="330" y1="154" x2="330" y2="164" marker-end="url(#d3)"/>

  <rect class="box" x="150" y="166" width="360" height="34" rx="3"/>
  <text class="sub" x="330" y="188" text-anchor="middle">updatePortalDrawList(vcam positions)</text>
  <line class="fl" x1="330" y1="200" x2="330" y2="210" marker-end="url(#d3)"/>

  <rect class="box" x="150" y="212" width="360" height="46" rx="3"/>
  <text class="sub" x="330" y="231" text-anchor="middle">Phase 2 — render each RTT</text>
  <text class="sub" x="330" y="247" text-anchor="middle">clip planes on, frustum culling bypassed</text>
  <line class="fl" x1="330" y1="258" x2="330" y2="268" marker-end="url(#d3)"/>

  <rect class="box" x="150" y="270" width="360" height="34" rx="3"/>
  <text class="sub" x="330" y="292" text-anchor="middle">clearPortalDrawList · install quad hook</text>
  <line class="fl" x1="330" y1="304" x2="330" y2="316" marker-end="url(#d3)"/>

  <rect class="box" x="150" y="318" width="360" height="34" rx="3"/>
  <text class="sub" x="330" y="340" text-anchor="middle">ClientMap solid pass</text>
  <line class="fl" x1="330" y1="352" x2="330" y2="362" marker-end="url(#d3k)"/>

  <rect class="box k" x="150" y="364" width="360" height="34" rx="3"/>
  <text class="k" x="330" y="386" text-anchor="middle">hook fires · drawPortalQuads()</text>
  <line class="fl" x1="330" y1="398" x2="330" y2="408" marker-end="url(#d3)"/>

  <rect class="box" x="150" y="410" width="360" height="46" rx="3"/>
  <text class="sub" x="330" y="429" text-anchor="middle">ClientMap transparent pass</text>
  <text class="sub" x="330" y="445" text-anchor="middle">glass blends over the portal image</text>
  <line class="fl" x1="330" y1="456" x2="330" y2="468" marker-end="url(#d3)"/>

  <rect class="box" x="150" y="470" width="360" height="46" rx="3"/>
  <text x="330" y="489" text-anchor="middle">PortalQuadStep</text>
  <text class="sub" x="330" y="505" text-anchor="middle">re-render only if the camera jumped ≥ 4 nodes</text>
  <line class="fl" x1="330" y1="516" x2="330" y2="526" marker-end="url(#d3)"/>

  <rect class="box" x="150" y="528" width="360" height="34" rx="3"/>
  <text class="sub" x="330" y="550" text-anchor="middle">post-processing</text>

  <!-- brackets -->
  <path class="fl" d="M 536 16 L 546 16 L 546 304 L 536 304" stroke-width="1" opacity=".5"/>
  <text class="hd" transform="rotate(-90 566 160)" x="566" y="160" text-anchor="middle">BEFORE DRAW3D</text>
  <path class="fl" d="M 536 318 L 546 318 L 546 456 L 536 456" stroke-width="1" opacity=".5"/>
  <text class="hd" transform="rotate(-90 566 387)" x="566" y="387" text-anchor="middle">INSIDE DRAW3D</text>
  <path class="fl" d="M 536 470 L 546 470 L 546 562 L 536 562" stroke-width="1" opacity=".5"/>
  <text class="hd" transform="rotate(-90 566 516)" x="566" y="516" text-anchor="middle">AFTER</text>
  </g>
</svg>
