<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1038 348"
     width="1038" height="348" role="img" aria-label="Server-side Lua decides portal state and crossings, protocol messages carry it across the process boundary, and the client's PortalManager, render steps, LocalPlayer and WorldSession consume it; the passive session reports its readiness back to the server.">
  <title>architecture</title>
  <desc>The portal is decided in Lua and drawn in C++. In a local singleplayer world those are the same process; for any other world these messages are the only thing holding the two halves together. Only the passive WorldSession talks back.</desc>
  <style>
    .bg   { fill: #FFFFFF; }
    .edge { fill: none; stroke: #DBE2E9; stroke-width: 1; }
    svg   { color: #10151C; }
    @media (prefers-color-scheme: dark) {
      .bg   { fill: #121921; }
      .edge { stroke: #1E2A36; }
      svg   { color: #E4EBF2; }
    }
    text { font-family: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Mono", Menlo, Consolas, monospace; font-size: 12px; fill: currentColor; }
    .lbl { font-size: 10.5px; opacity: .72; }
    .sub { font-size: 10.5px; opacity: .7; }
    .hd  { font-size: 10px; letter-spacing: .12em; opacity: .55; }
    .box { fill: none; stroke: currentColor; stroke-width: 1.4; }
    .grp { fill: none; stroke: currentColor; stroke-width: 1; stroke-dasharray: 4 4; opacity: .4; }
    .fl  { fill: none; stroke: currentColor; stroke-width: 1.4; }
    .life{ stroke: currentColor; stroke-width: 1; stroke-dasharray: 3 4; opacity: .4; }
    .k   { stroke: #3193DB; }
    .o   { stroke: #DD7F3C; }
    text.k { fill: #3193DB; stroke: none; }
    text.o { fill: #DD7F3C; stroke: none; }
  </style>
  <rect class="bg" x="0" y="0" width="1038" height="348" rx="4"/>
  <rect class="edge" x="0.5" y="0.5" width="1037" height="347" rx="4"/>
  <g transform="translate(14 14)">
<defs>
    <marker id="d1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/>
    </marker>
    <marker id="d1o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#DD7F3C"/>
    </marker>
  </defs>

  <text class="hd" x="114" y="24" text-anchor="middle">SERVER · LUA</text>
  <text class="hd" x="385" y="24" text-anchor="middle">WIRE</text>
  <text class="hd" x="719" y="24" text-anchor="middle">CLIENT · C++</text>

  <rect class="box" x="24" y="54" width="180" height="44" rx="3"/>
  <text x="114" y="74" text-anchor="middle">yaportal</text>
  <text class="sub" x="114" y="89" text-anchor="middle">portals[name] table</text>
  <rect class="box" x="24" y="204" width="180" height="44" rx="3"/>
  <text x="114" y="224" text-anchor="middle">yaportal_link</text>
  <text class="sub" x="114" y="239" text-anchor="middle">registry + pairing</text>

  <rect class="box" x="300" y="62" width="170" height="28" rx="14"/>
  <text class="sub" x="385" y="80" text-anchor="middle">PORTAL_STATE</text>
  <rect class="box" x="300" y="162" width="170" height="28" rx="14"/>
  <text class="sub" x="385" y="180" text-anchor="middle">PORTAL_TELEPORT</text>
  <rect class="box" x="300" y="212" width="170" height="28" rx="14"/>
  <text class="sub" x="385" y="230" text-anchor="middle">XWORLD_SWAP</text>
  <rect class="box o" x="300" y="272" width="170" height="28" rx="14"/>
  <text class="sub o" x="385" y="290" text-anchor="middle">XWORLD_STATUS</text>

  <rect class="grp" x="556" y="44" width="326" height="204" rx="4"/>
  <rect class="box" x="572" y="58" width="294" height="36" rx="3"/>
  <text x="719" y="81" text-anchor="middle">PortalManager · 16 slots</text>
  <rect class="box k" x="572" y="106" width="294" height="44" rx="3"/>
  <text x="719" y="125" text-anchor="middle">portal render steps</text>
  <text class="sub" x="719" y="141" text-anchor="middle">RTT + tunnel quads</text>
  <rect class="box" x="572" y="162" width="294" height="28" rx="3"/>
  <text class="sub" x="719" y="180" text-anchor="middle">LocalPlayer · snapView / warp</text>
  <rect class="box o" x="572" y="206" width="294" height="40" rx="3"/>
  <text x="719" y="224" text-anchor="middle">WorldSession</text>
  <text class="sub" x="719" y="239" text-anchor="middle">passive second client</text>

  <line class="fl" x1="204" y1="76" x2="294" y2="76" marker-end="url(#d1)"/>
  <text class="lbl" x="249" y="68" text-anchor="middle">set_portals</text>
  <path class="fl" d="M 204 88 L 250 88 L 250 176 L 294 176" marker-end="url(#d1)"/>
  <text class="lbl" x="258" y="140">portal_teleport</text>
  <line class="fl" x1="204" y1="226" x2="294" y2="226" marker-end="url(#d1)"/>
  <text class="lbl" x="244" y="210" text-anchor="middle">xworld_swap_player</text>

  <line class="fl" x1="470" y1="76"  x2="566" y2="76"  marker-end="url(#d1)"/>
  <line class="fl" x1="470" y1="176" x2="566" y2="176" marker-end="url(#d1)"/>
  <line class="fl" x1="470" y1="226" x2="566" y2="226" marker-end="url(#d1)"/>

  <line class="fl" x1="600" y1="94" x2="600" y2="102" marker-end="url(#d1)"/>
  <path class="fl" d="M 866 226 L 920 226 L 920 128 L 872 128" marker-end="url(#d1)"/>
  <text class="lbl" x="928" y="132">portal view</text>

  <path class="fl o" d="M 700 246 L 700 286 L 476 286" marker-end="url(#d1o)"/>
  <path class="fl o" d="M 300 286 L 114 286 L 114 254" marker-end="url(#d1o)"/>
  <text class="lbl o" x="196" y="306" text-anchor="middle">ready · addr · world, every 2 s</text>
  </g>
</svg>
